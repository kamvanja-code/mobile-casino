<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grand Velvet Casino</title>
   <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- ЭКРАН РЕГИСТРАЦИИ / ВХОДА -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <div class="casino-brand">
                <h1 class="brand-title">GRAND</h1>
                <div class="brand-badge">VELVET</div>
                <p class="brand-subtitle">EXCLUSIVE LOUNGE</p>
            </div>

            <div class="auth-box">
                <h2>Регистрация члена клуба</h2>
                <p class="auth-notice">Введите уникальный никнейм. Прогресс и баланс автоматически привяжутся к вашему устройству.</p>

                <div class="input-field">
                    <input type="text" id="username-input" placeholder="Ваш никнейм..." maxlength="14" autocomplete="off">
                    <span class="glow-line"></span>
                </div>

                <button id="login-btn" class="btn-premium">Получить фишки</button>
            </div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="screen">
        <!-- Верхний статус-бар -->
        <header class="top-bar">
            <div class="player-tag">
                <span class="vip-status">VIP</span>
                <span id="user-name" class="name">GUEST</span>
            </div>
            <div class="wallet">
                <span class="wallet-label">ДЕПОЗИТ</span>
                <div class="wallet-amount">
                    <span id="user-balance">1,000</span>
                    <span class="currency-sign">$</span>
                </div>
            </div>
        </header>

        <!-- Игровая сцена -->
        <main class="table-scene">

            <!-- Секция с рулеткой -->
            <div class="roulette-section">
                <div class="roulette-wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel-outer-rim">
                        <div id="wheel" class="wheel-spindle">
                            <!-- Центр колеса -->
                            <div class="wheel-hub"></div>
                        </div>
                    </div>
                    <!-- Анимированный шарик, который будет летать снаружи -->
                    <div id="roulette-ball" class="roulette-ball hidden"></div>
                </div>
            </div>

            <!-- Информационное табло результатов -->
            <div class="display-board">
                <div id="status-message" class="ticker-message">СДЕЛАЙТЕ ВАШИ СТАВКИ</div>
            </div>

            <!-- Сукно игрового стола (Ставки) -->
            <div class="betting-felt">
                <div class="bet-spot spot-red" data-target="red">
                    <span class="spot-title">RED</span>
                    <span class="spot-odds">1 TO 1</span>
                    <div id="chip-space-red" class="chip-holder hidden"></div>
                </div>

                <div class="bet-spot spot-zero" data-target="zero">
                    <span class="spot-title">0</span>
                    <span class="spot-odds">35 TO 1</span>
                    <div id="chip-space-zero" class="chip-holder hidden"></div>
                </div>

                <div class="bet-spot spot-black" data-target="black">
                    <span class="spot-title">BLACK</span>
                    <span class="spot-odds">1 TO 1</span>
                    <div id="chip-space-black" class="chip-holder hidden"></div>
                </div>
            </div>

            <!-- Панель управления фишками и запуском -->
            <div class="dealer-panel">
                <div class="chips-tray">
                    <div class="casino-chip chip-cyan active" data-value="10">10</div>
                    <div class="casino-chip chip-magenta" data-value="50">50</div>
                    <div class="casino-chip chip-gold" data-value="100">100</div>
                    <div class="casino-chip chip-purple" data-value="500">500</div>
                </div>

                <div class="action-grid">
                    <button id="clear-btn" class="action-btn btn-secondary">Сбросить</button>
                    <button id="spin-btn" class="action-btn btn-action-spin">ЗАПУСК</button>
                    <button id="refill-btn" class="action-btn btn-gold-refill">+500 $</button>
                </div>
            </div>

        </main>
    </div>

<script src="app.js"></script>
</body>
</html>
